name: Build Kernel

on:
  push:
    branches: [ sukisu-4.19, ksu-next-4.19, realme-ui-ksu ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential curl flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git gnupg gperf libncurses5-dev libssl-dev python2 python3 zip zlib1g-dev

    - name: Fetch and apply 5.15 BPF patches
      run: |
        # 配置仓库本地 Git 身份（不依赖全局设置）
        git config user.name "EthanDev200"
        git config user.email "EthanDev200@users.noreply.github.com"

        # 拉取补丁源
        git remote add bpf-src https://github.com/Mi8937/msm-4.19.git
        git fetch bpf-src 5.15-bpf

        # 合入补丁
        git cherry-pick bpf-src/5.15-bpf -X theirs

    - name: Inject required BPF/BTF configs
      run: |
        echo "CONFIG_BPF=y" >> arch/arm64/configs/cupida_defconfig
        echo "CONFIG_BPF_SYSCALL=y" >> arch/arm64/configs/cupida_defconfig
        echo "CONFIG_BPF_JIT=y" >> arch/arm64/configs/cupida_defconfig
        echo "CONFIG_BPF_JIT_ALWAYS_ON=y" >> arch/arm64/configs/cupida_defconfig
        echo "CONFIG_BPF_JIT_DEFAULT_ON=y" >> arch/arm64/configs/cupida_defconfig
        echo "CONFIG_BPF_EVENTS=y" >> arch/arm64/configs/cupida_defconfig
        echo "CONFIG_BPF_RINGBUF=y" >> arch/arm64/configs/cupida_defconfig
        echo "CONFIG_BPF_LINK=y" >> arch/arm64/configs/cupida_defconfig
        echo "CONFIG_CGROUP_BPF=y" >> arch/arm64/configs/cupida_defconfig
        echo "CONFIG_DEBUG_INFO=y" >> arch/arm64/configs/cupida_defconfig
        echo "CONFIG_DEBUG_INFO_BTF=y" >> arch/arm64/configs/cupida_defconfig
        echo "CONFIG_DEBUG_INFO_BTF_MODULES=y" >> arch/arm64/configs/cupida_defconfig
        echo "CONFIG_LSM_BPF=y" >> arch/arm64/configs/cupida_defconfig
        echo "CONFIG_BPF_KPROBES=y" >> arch/arm64/configs/cupida_defconfig
        echo "CONFIG_BPF_PERF_EVENTS=y" >> arch/arm64/configs/cupida_defconfig
        echo "CONFIG_BPF_TRACEPOINT=y" >> arch/arm64/configs/cupida_defconfig

    - name: Set up Proton Clang
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/toolchain/proton-clang

    - name: Build Kernel
      env:
        TOOLCHAIN: ${{ github.workspace }}/toolchain/proton-clang
      run: |
        bash build_kernel.sh

    - name: Show errors on failure
      if: failure()
      run: grep -E "error:|fatal error:" build.log | head -30

    - name: Print build log on failure
      if: failure()
      run: tail -100 build.log

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb

    - name: Prepare AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cp anykernel_template.sh AnyKernel3/anykernel.sh
        rm -rf AnyKernel3/.git

    - name: Upload Flashable Zip
      uses: actions/upload-artifact@v4
      with:
        name: Realme_UI_KSU_RMX3031
        path: AnyKernel3/