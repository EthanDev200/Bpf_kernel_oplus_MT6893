name: Build Kernel

on:
  push:
    branches: [ sukisu-4.19 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential curl flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git gnupg gperf libncurses5-dev libssl-dev python2 python3 zip zlib1g-dev

    - name: Set up Proton Clang
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/toolchain/proton-clang

    - name: Build Kernel
      env:
        TOOLCHAIN: ${{ github.workspace }}/toolchain/proton-clang
      run: |
        bash build_kernel.sh

    - name: Show errors on failure
      if: failure()
      run: grep -E "error:|fatal error:" build.log | head -30

    - name: Print build log on failure
      if: failure()
      run: tail -100 build.log

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb

    - name: Create AnyKernel3 Zip
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cp anykernel_template.sh AnyKernel3/anykernel.sh
        cd AnyKernel3
        rm -rf .git
        zip -r9 ../SukiSU_Ultra_RMX3031.zip *

    - name: Upload Flashable Zip
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU_Ultra_RMX3031
        path: SukiSU_Ultra_RMX3031.zip
